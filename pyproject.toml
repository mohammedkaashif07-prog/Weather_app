[project]
name = "weather-app"
version = "0.1.0"
description = "A Streamlit weather app powered by OpenWeatherMap."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"python-dotenv>=1.0.1",
	"requests>=2.32.0",
	"streamlit>=1.64.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
